<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteira CS — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1923;--card:#1a2733;--card2:#223344;--text:#e0e6ed;--muted:#8899aa;--accent:#00b4d8;--green:#00b894;--yellow:#fdcb6e;--orange:#e17055;--red:#d63031;--pink:#e84393;--purple:#6c5ce7;--border:#2d3e50;--hover:#253545}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* NAV */
.nav{background:#0d1520;border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.nav-brand{font-size:1.1rem;font-weight:700;color:var(--accent);padding:1rem 0;margin-right:2rem;white-space:nowrap}
.nav-brand small{color:var(--muted);font-weight:400;font-size:.75rem;margin-left:.5rem}
.nav-tabs{display:flex;gap:0;overflow-x:auto}
.nav-tab{padding:.9rem 1.2rem;color:var(--muted);text-decoration:none;font-size:.85rem;font-weight:500;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
/* PAGES */
.page{display:none;padding:1.5rem 2rem 3rem;max-width:1400px;margin:0 auto}
.page.active{display:block}
/* SECTION */
.section-title{font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:1.5rem 0 .8rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
.section-title:first-child{margin-top:0}
/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem;margin-bottom:1rem}
.kpi{background:var(--card);border-radius:10px;padding:1rem;border:1px solid var(--border)}
.kpi-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.3rem}
.kpi-value{font-size:1.6rem;font-weight:800}
.kpi-sub{font-size:.72rem;color:var(--muted);margin-top:.2rem}
.kpi-bar{height:4px;border-radius:2px;background:#1e2e3e;margin-top:.4rem;overflow:hidden}
.kpi-bar span{display:block;height:100%;border-radius:2px}
/* CHARTS */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:1rem;margin-bottom:1rem}
.chart-card{background:var(--card);border-radius:10px;padding:1rem;border:1px solid var(--border)}
.chart-card h3{font-size:.85rem;margin-bottom:.8rem;color:var(--text)}
/* SPECIALIST CARDS */
.spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;margin-bottom:1rem}
.spec-card{background:var(--card);border-radius:10px;padding:1rem;border:1px solid var(--border)}
.spec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.spec-name{font-size:1rem;font-weight:700}
.badge{font-size:.65rem;padding:.25rem .6rem;border-radius:12px;font-weight:600;text-transform:uppercase}
.badge-onboarding{background:#00b89422;color:var(--green)}
.badge-ongoing{background:#fdcb6e22;color:var(--yellow)}
.spec-row{display:flex;justify-content:space-between;padding:.35rem 0;font-size:.8rem;border-bottom:1px solid #1e2e3e}
.spec-row:last-child{border:0}
.spec-row .val{font-weight:600}
.result-badge{font-size:.75rem;padding:.15rem .5rem;border-radius:8px;font-weight:700}
/* TABLE */
.table-wrap{overflow-x:auto;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{background:var(--card2);color:var(--muted);text-transform:uppercase;font-size:.68rem;letter-spacing:.5px;padding:.6rem .5rem;text-align:left;position:sticky;top:0}
td{padding:.5rem;border-bottom:1px solid #1a2a3a;vertical-align:top}
tr:hover td{background:#1e2e3e}
.pill{font-size:.65rem;padding:.15rem .4rem;border-radius:6px;white-space:nowrap}
.pill-green{background:#00b89422;color:var(--green)}
.pill-yellow{background:#fdcb6e22;color:var(--yellow)}
.pill-red{background:#d6303122;color:var(--red)}
.pill-blue{background:#00b4d822;color:var(--accent)}
.pill-purple{background:#6c5ce722;color:var(--purple)}
.pill-gray{background:#88999a22;color:var(--muted)}
/* FILTERS */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.filter-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:.4rem .8rem;border-radius:6px;cursor:pointer;font-size:.75rem;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* PIPELINE */
.pipeline-card{background:var(--card);border-radius:10px;padding:.8rem;border:1px solid var(--border);margin-bottom:.5rem}
.pipeline-card .header{display:flex;justify-content:space-between;align-items:center}
.pipeline-card .name{font-weight:600;font-size:.85rem}
.pipeline-card .obs{font-size:.72rem;color:var(--muted);margin-top:.3rem}
.pipeline-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.pipeline-col h3{font-size:.85rem;margin-bottom:.6rem;padding:.5rem;border-radius:6px;text-align:center}
/* BACKUP */
.backup-card{background:var(--card);border-radius:10px;padding:1rem;border:1px solid var(--border);margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.backup-card .mes{font-weight:600}
.backup-card a{color:var(--accent);font-size:.8rem}
/* STATS ROW */
.stats-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.stat-box{background:var(--card);border-radius:8px;padding:.6rem 1rem;border:1px solid var(--border);text-align:center;min-width:100px}
.stat-box .num{font-size:1.3rem;font-weight:800}
.stat-box .label{font-size:.65rem;color:var(--muted);text-transform:uppercase}
/* RESPONSIVE */
@media(max-width:768px){
  .nav{flex-direction:column;padding:.5rem 1rem}
  .nav-brand{margin-right:0}
  .page{padding:1rem}
  .charts-grid,.spec-grid,.pipeline-cols{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand" id="navBrand">[Junho] Carteira CS <small>Dashboard</small></div>
  <div class="nav-tabs" id="navTabs"></div>
</nav>

<div id="page-visao" class="page active"></div>
<div id="page-desempenho" class="page"></div>
<div id="page-churn" class="page"></div>
<div id="page-pipeline" class="page"></div>
<div id="page-reunioes" class="page"></div>
<div id="page-renovacoes" class="page"></div>
<div id="page-clientes" class="page"></div>
<div id="page-backups" class="page"></div>

<script>
const PAGES = [
  {id:'visao', label:'Visao Geral'},
  {id:'desempenho', label:'Desempenho'},
  {id:'churn', label:'Churn & Lost'},
  {id:'pipeline', label:'Pipeline Diario'},
  {id:'reunioes', label:'Reunioes'},
  {id:'renovacoes', label:'Renovacoes'},
  {id:'clientes', label:'Todos Clientes'},
  {id:'backups', label:'Backups'},
];

function initNav(){
  const tabs = document.getElementById('navTabs');
  PAGES.forEach((p,i)=>{
    const t = document.createElement('div');
    t.className = 'nav-tab' + (i===0?' active':'');
    t.textContent = p.label;
    t.dataset.page = p.id;
    t.onclick = ()=> switchPage(p.id);
    tabs.appendChild(t);
  });
}

function switchPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelector(`.nav-tab[data-page="${id}"]`).classList.add('active');
}

function pillClass(status){
  if(!status) return 'pill-gray';
  const s = status.toLowerCase();
  if(s.includes('30 dias') || s.includes('últimos 30')) return 'pill-green';
  if(s.includes('31') && s.includes('50')) return 'pill-yellow';
  if(s.includes('50 dias ou mais') || s.includes('sem contrato')) return 'pill-red';
  if(s.includes('novo')) return 'pill-blue';
  return 'pill-gray';
}

function termPill(t){
  if(!t) return 'pill-gray';
  const s = t.toLowerCase();
  if(s.includes('vai ativar')) return 'pill-green';
  if(s.includes('promessa')) return 'pill-yellow';
  if(s.includes('não vai')) return 'pill-red';
  if(s.includes('onboarding')) return 'pill-blue';
  return 'pill-gray';
}

function pipelinePill(s){
  if(!s) return 'pill-gray';
  const l = s.toLowerCase();
  if(l.includes('andamento')) return 'pill-green';
  if(l.includes('primeiro')) return 'pill-yellow';
  if(l.includes('perdido') || l.includes('lost')) return 'pill-red';
  return 'pill-gray';
}

function resultColor(v){
  if(v>=80) return 'var(--green)';
  if(v>=50) return 'var(--yellow)';
  return 'var(--orange)';
}

function barColor(pct){
  if(pct>=80) return 'var(--green)';
  if(pct>=50) return 'var(--yellow)';
  return 'var(--orange)';
}

(async function(){
  const resp = await fetch('data.json');
  const D = await resp.json();

  document.getElementById('navBrand').innerHTML = `${D.titulo} <small>${D.periodo}</small>`;
  initNav();

  const mg = D.meta_geral;
  const vg = D.visao_geral;
  const mi = D.meta_individual;
  const cp = D.clientes_perdidos;

  // ===== PAGE: VISAO GERAL =====
  const visao = document.getElementById('page-visao');
  visao.innerHTML = `
    <div class="section-title">KPIs Principais</div>
    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-label">Clientes na Carteira</div>
        <div class="kpi-value" style="color:var(--accent)">${vg.total_clientes}</div>
        <div class="kpi-sub">Media ${vg.media_contratos} contratos/cliente</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Meta de Contratos</div>
        <div class="kpi-value" style="color:var(--yellow)">${mg.contratos.realizado_geral}/${mg.contratos.meta_geral}</div>
        <div class="kpi-sub">${mg.contratos.pct_geral}% atingido</div>
        <div class="kpi-bar"><span style="width:${Math.min(mg.contratos.pct_geral,100)}%;background:${barColor(mg.contratos.pct_geral)}"></span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Contratos Emitidos (Jun)</div>
        <div class="kpi-value" style="color:var(--purple)">${vg.contratos_emitidos_junho}</div>
        <div class="kpi-sub">${vg.contratos_ativos} contratos ativos</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Retencao</div>
        <div class="kpi-value" style="color:var(--green)">${mg.retencao.pct_retencao}%</div>
        <div class="kpi-sub">${mg.retencao.clientes_totais} clientes | ${mg.retencao.clientes_reverter} p/ reverter</div>
        <div class="kpi-bar"><span style="width:${mg.retencao.pct_retencao}%;background:var(--green)"></span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Onboarding</div>
        <div class="kpi-value" style="color:var(--green)">${mg.onboarding.realizado}/${mg.onboarding.meta}</div>
        <div class="kpi-sub">${mg.onboarding.pct}% | ${mg.onboarding.clientes_revertidos} revertidos</div>
        <div class="kpi-bar"><span style="width:${Math.min(mg.onboarding.pct,100)}%;background:${barColor(mg.onboarding.pct)}"></span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Ongoing</div>
        <div class="kpi-value" style="color:var(--orange)">${mg.ongoing.realizado}/${mg.ongoing.meta}</div>
        <div class="kpi-sub">${mg.ongoing.pct}% atingido</div>
        <div class="kpi-bar"><span style="width:${Math.min(mg.ongoing.pct,100)}%;background:${barColor(mg.ongoing.pct)}"></span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Clientes em Lost</div>
        <div class="kpi-value" style="color:var(--red)">${cp.total}</div>
        <div class="kpi-sub">200+ dias sem contrato</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Foco da Semana</div>
        <div class="kpi-value" style="color:var(--accent)">${D.foco_semana.length}</div>
        <div class="kpi-sub">Clientes com acoes planejadas</div>
      </div>
    </div>

    <div class="section-title">Distribuicao</div>
    <div class="charts-grid">
      <div class="chart-card"><h3>Status dos Clientes</h3><canvas id="statusChart"></canvas></div>
      <div class="chart-card"><h3>Clientes por Carteira</h3><canvas id="carteiraChart"></canvas></div>
    </div>

    <div class="section-title">Analise de Churn</div>
    <div class="charts-grid">
      <div class="chart-card"><h3>Dias sem Contrato (Distribuicao)</h3><canvas id="churnChart"></canvas></div>
      <div class="chart-card"><h3>Motivos de Lost</h3><canvas id="motivoChart"></canvas></div>
    </div>
  `;

  // Status chart
  const statusLabels = Object.keys(vg.status_distribution);
  const statusColors = statusLabels.map(s=>{
    if(s.includes('30 dias')) return '#00b894';
    if(s.includes('31')) return '#fdcb6e';
    if(s.includes('50 dias')) return '#e17055';
    if(s.includes('Desconhecido')) return '#636e72';
    return '#74b9ff';
  });
  new Chart(document.getElementById('statusChart'),{
    type:'doughnut',
    data:{labels:statusLabels.map(s=>s.length>30?s.slice(0,30)+'...':s),datasets:[{data:Object.values(vg.status_distribution),backgroundColor:statusColors,borderWidth:0,hoverOffset:8}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#8899aa',font:{size:11}}}},cutout:'65%'}
  });

  // Carteira chart
  const cartLabels = Object.keys(vg.carteira_distribution);
  const cartColors = ['#00b4d8','#00b894','#fdcb6e','#e84393','#636e72'];
  new Chart(document.getElementById('carteiraChart'),{
    type:'bar',
    data:{labels:cartLabels,datasets:[{data:Object.values(vg.carteira_distribution),backgroundColor:cartColors.slice(0,cartLabels.length),borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8899aa'}},y:{ticks:{color:'#8899aa'},grid:{color:'#1e2e3e'}}}}
  });

  // Churn chart
  new Chart(document.getElementById('churnChart'),{
    type:'bar',
    data:{labels:D.churn.map(c=>c.range),datasets:[{data:D.churn.map(c=>c.count),backgroundColor:D.churn.map((_,i)=>i<2?'#00b894':i<4?'#fdcb6e':'#e17055'),borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8899aa',font:{size:10}}},y:{ticks:{color:'#8899aa'},grid:{color:'#1e2e3e'}}}}
  });

  // Motivo Lost chart
  const motLabels = Object.keys(cp.motivos);
  const motColors = ['#e17055','#fdcb6e','#00b894','#74b9ff','#e84393','#6c5ce7','#636e72','#fd79a8'];
  new Chart(document.getElementById('motivoChart'),{
    type:'doughnut',
    data:{labels:motLabels,datasets:[{data:Object.values(cp.motivos),backgroundColor:motColors.slice(0,motLabels.length),borderWidth:0,hoverOffset:8}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#8899aa',font:{size:10}}}},cutout:'60%'}
  });

  // ===== PAGE: DESEMPENHO =====
  const desemp = document.getElementById('page-desempenho');
  let specHtml = '<div class="section-title">Desempenho Individual</div><div class="spec-grid">';
  mi.forEach(s=>{
    const badgeClass = s.tipo==='Onboarding'?'badge-onboarding':'badge-ongoing';
    const rc = resultColor(s.resultado_final);
    let rows = `
      <div class="spec-row"><span>Clientes na carteira</span><span class="val">${s.contratos.clientes_carteira}</span></div>
      <div class="spec-row"><span>Meta de contratos</span><span class="val">${s.contratos.meta}</span></div>
      <div class="spec-row"><span>Contratos ativos</span><span class="val">${s.contratos.ativos}</span></div>
      <div class="spec-row"><span>% Contratos</span><span class="val" style="color:${barColor(s.contratos.pct)}">${s.contratos.pct}%</span></div>`;
    if(s.segundo_contrato){
      rows += `<div class="spec-row"><span>2o contrato emitido</span><span class="val">${s.segundo_contrato.realizado}</span></div>`;
    }
    if(s.retencao){
      rows += `
        <div class="spec-row"><span>Clientes em risco</span><span class="val">${s.retencao.clientes_risco}</span></div>
        <div class="spec-row"><span>Clientes revertidos</span><span class="val">${s.retencao.revertidos}</span></div>`;
    }
    rows += `<div class="spec-row"><span>Resultado Final</span><span class="result-badge" style="background:${rc}22;color:${rc}">${s.resultado_final}%</span></div>`;
    specHtml += `<div class="spec-card"><div class="spec-header"><span class="spec-name">${s.nome}</span><span class="badge ${badgeClass}">${s.tipo}</span></div>${rows}</div>`;
  });
  specHtml += '</div>';

  // Meta comparison chart
  specHtml += '<div class="section-title">Comparacao de Metas</div><div class="charts-grid"><div class="chart-card"><h3>Meta vs Realizado por Especialista</h3><canvas id="metaCompChart"></canvas></div><div class="chart-card"><h3>Resultado Final (%)</h3><canvas id="resultChart"></canvas></div></div>';
  desemp.innerHTML = specHtml;

  new Chart(document.getElementById('metaCompChart'),{
    type:'bar',
    data:{labels:mi.map(s=>s.nome),datasets:[
      {label:'Meta',data:mi.map(s=>s.contratos.meta),backgroundColor:'#00b4d844',borderColor:'#00b4d8',borderWidth:1},
      {label:'Realizado',data:mi.map(s=>s.contratos.ativos),backgroundColor:'#00b89444',borderColor:'#00b894',borderWidth:1}
    ]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#8899aa'}}},scales:{x:{ticks:{color:'#8899aa'}},y:{ticks:{color:'#8899aa'},grid:{color:'#1e2e3e'}}}}
  });

  new Chart(document.getElementById('resultChart'),{
    type:'bar',
    data:{labels:mi.map(s=>s.nome),datasets:[{data:mi.map(s=>s.resultado_final),backgroundColor:mi.map(s=>resultColor(s.resultado_final)),borderRadius:4}]},
    options:{responsive:true,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100,ticks:{color:'#8899aa'},grid:{color:'#1e2e3e'}},y:{ticks:{color:'#8899aa'}}}}
  });

  // ===== PAGE: CHURN & LOST =====
  const churnPage = document.getElementById('page-churn');
  let lostHtml = `<div class="section-title">Clientes em Lost (${cp.total})</div>
    <div class="stats-row">
      ${Object.entries(cp.motivos).map(([m,c])=>`<div class="stat-box"><div class="num">${c}</div><div class="label">${m}</div></div>`).join('')}
    </div>
    <div class="table-wrap"><table><thead><tr><th>Corretor</th><th>Dias s/ contrato</th><th>Contratos anteriores</th><th>Entrou em Lost</th><th>Motivo</th><th>Consideracoes</th></tr></thead><tbody>`;
  cp.clients.forEach(c=>{
    lostHtml += `<tr><td>${c.corretor}</td><td>${c.dias_sem_contrato} dias</td><td>${c.contratos_anteriores}</td><td>${c.entrou_lost}</td><td><span class="pill pill-red">${c.motivo}</span></td><td style="max-width:300px;font-size:.7rem">${c.consideracoes||''}</td></tr>`;
  });
  lostHtml += '</tbody></table></div>';
  churnPage.innerHTML = lostHtml;

  // ===== PAGE: PIPELINE DIARIO =====
  const pipeline = document.getElementById('page-pipeline');
  const focoStatuses = {};
  D.foco_semana.forEach(f=>{
    const s = f.status || 'Sem status';
    if(!focoStatuses[s]) focoStatuses[s] = [];
    focoStatuses[s].push(f);
  });

  let pipHtml = '<div class="section-title">Pipeline Diario — Foco da Semana</div>';
  pipHtml += '<div class="stats-row">';
  Object.entries(focoStatuses).forEach(([s,items])=>{
    pipHtml += `<div class="stat-box"><div class="num">${items.length}</div><div class="label">${s}</div></div>`;
  });
  pipHtml += '</div>';

  pipHtml += '<div class="filters" id="pipelineFilters"><div class="filter-btn active" data-filter="all">Todos ${D.foco_semana.length}</div>';
  Object.entries(focoStatuses).forEach(([s,items])=>{
    pipHtml += `<div class="filter-btn" data-filter="${s}">${s} ${items.length}</div>`;
  });
  pipHtml += '</div>';

  pipHtml += '<div class="table-wrap"><table id="pipelineTable"><thead><tr><th>Cliente</th><th>Status</th><th>Especialista</th><th>Contratos Prev.</th><th>Valor 2k</th><th>Jamile</th><th>Observacao</th></tr></thead><tbody>';
  D.foco_semana.forEach(f=>{
    pipHtml += `<tr data-status="${f.status||'Sem status'}">
      <td style="font-weight:600">${f.nome}</td>
      <td><span class="pill ${termPill(f.status)}">${f.status||'—'}</span></td>
      <td>${f.especialista||'—'}</td>
      <td style="text-align:center">${f.contratos_previstos||0}</td>
      <td style="text-align:center">${f.valor_2k?'Sim':'—'}</td>
      <td style="text-align:center">${f.atuacao_jamile?'Sim':'—'}</td>
      <td style="max-width:250px;font-size:.7rem">${f.observacao||''}</td>
    </tr>`;
  });
  pipHtml += '</tbody></table></div>';
  pipeline.innerHTML = pipHtml;

  document.querySelectorAll('#pipelineFilters .filter-btn').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('#pipelineFilters .filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;
      document.querySelectorAll('#pipelineTable tbody tr').forEach(tr=>{
        tr.style.display = (filter==='all' || tr.dataset.status===filter)?'':'none';
      });
    };
  });

  // ===== PAGE: REUNIOES =====
  const reunioes = document.getElementById('page-reunioes');
  let reunHtml = '<div class="section-title">Reunioes Realizadas</div>';
  reunHtml += `<div class="stats-row">
    <div class="stat-box"><div class="num">${D.reunioes.total}</div><div class="label">Total Reunioes</div></div>
    ${Object.entries(D.reunioes.by_specialist).map(([s,c])=>`<div class="stat-box"><div class="num">${c}</div><div class="label">${s}</div></div>`).join('')}
  </div>`;
  if(D.reunioes.meetings.length){
    reunHtml += '<div class="table-wrap"><table><thead><tr><th>Data</th><th>Especialista</th><th>Cliente</th></tr></thead><tbody>';
    D.reunioes.meetings.sort((a,b)=>a.data.localeCompare(b.data)).forEach(m=>{
      reunHtml += `<tr><td>${m.data}</td><td>${m.especialista}</td><td>${m.cliente}</td></tr>`;
    });
    reunHtml += '</tbody></table></div>';
  }
  reunioes.innerHTML = reunHtml;

  // ===== PAGE: RENOVACOES =====
  const renovacoes = document.getElementById('page-renovacoes');
  let renHtml = '<div class="section-title">Renovacoes de Contratos</div>';
  renHtml += `<div class="stats-row"><div class="stat-box"><div class="num">${D.renovacoes.length}</div><div class="label">Contratos</div></div></div>`;
  if(D.renovacoes.length){
    renHtml += '<div class="table-wrap"><table><thead><tr><th>Codigo</th><th>Responsavel</th><th>Valor Aluguel</th><th>Inicio</th><th>Termino Previsto</th><th>Termino Real</th></tr></thead><tbody>';
    D.renovacoes.forEach(r=>{
      renHtml += `<tr><td>${r.codigo||'—'}</td><td>${r.responsavel||'—'}</td><td>R$ ${r.valor_aluguel.toLocaleString('pt-BR',{minimumFractionDigits:2})}</td><td>${r.data_inicio}</td><td>${r.data_prevista_termino}</td><td>${r.data_real_termino==='NULL'?'—':r.data_real_termino}</td></tr>`;
    });
    renHtml += '</tbody></table></div>';
  }
  renovacoes.innerHTML = renHtml;

  // ===== PAGE: TODOS CLIENTES =====
  const clientes = document.getElementById('page-clientes');
  let cliHtml = '<div class="section-title">Todos os Clientes</div>';
  cliHtml += '<div class="filters" id="clientFilters">';
  cliHtml += `<div class="filter-btn active" data-filter="all">Todos ${vg.clients.length}</div>`;
  Object.entries(vg.carteira_distribution).forEach(([k,v])=>{
    cliHtml += `<div class="filter-btn" data-filter="${k}">${k} ${v}</div>`;
  });
  cliHtml += '</div>';
  cliHtml += '<div class="table-wrap"><table id="clientTable"><thead><tr><th>Corretor</th><th>Dias s/ contrato</th><th>Status</th><th>Carteira</th><th>Contratos (ate Abr)</th><th>Contratos (Jun)</th><th>Lost?</th></tr></thead><tbody>';
  vg.clients.forEach(c=>{
    const dias = c.dias_sem_contrato !== null ? Math.round(c.dias_sem_contrato) : '—';
    cliHtml += `<tr data-carteira="${c.carteira}">
      <td style="font-weight:500">${c.corretor}</td>
      <td>${dias}</td>
      <td><span class="pill ${pillClass(c.status)}">${c.status||'—'}</span></td>
      <td>${c.carteira}</td>
      <td style="text-align:center">${c.contratos_ate_abril}</td>
      <td style="text-align:center">${c.contrato_ativo_junho}</td>
      <td>${c.lost==='SIM'?'<span class="pill pill-red">SIM</span>':c.lost==='NOVO'?'<span class="pill pill-blue">NOVO</span>':c.lost||'—'}</td>
    </tr>`;
  });
  cliHtml += '</tbody></table></div>';
  clientes.innerHTML = cliHtml;

  document.querySelectorAll('#clientFilters .filter-btn').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('#clientFilters .filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;
      document.querySelectorAll('#clientTable tbody tr').forEach(tr=>{
        tr.style.display = (filter==='all' || tr.dataset.carteira===filter)?'':'none';
      });
    };
  });

  // ===== PAGE: BACKUPS =====
  const backups = document.getElementById('page-backups');
  let bkHtml = '<div class="section-title">Backups Mensais</div>';
  bkHtml += '<p style="color:var(--muted);font-size:.8rem;margin-bottom:1rem">Snapshots mensais dos dados da carteira. Cada backup preserva o estado completo dos clientes naquele mes.</p>';
  if(D.backups && D.backups.length){
    D.backups.forEach(b=>{
      bkHtml += `<div class="backup-card"><span class="mes">${b.mes}</span>${b.url?`<a href="${b.url}" target="_blank">Abrir planilha &rarr;</a>`:'—'}</div>`;
    });
  }
  bkHtml += `<div class="backup-card" style="border-color:var(--accent)"><span class="mes" style="color:var(--accent)">Junho 2025 (Atual)</span><span class="pill pill-green">Em andamento</span></div>`;
  bkHtml += '<div style="margin-top:1.5rem;padding:1rem;background:var(--card);border-radius:10px;border:1px solid var(--border)">';
  bkHtml += '<h4 style="font-size:.85rem;margin-bottom:.5rem">Como funciona o backup mensal</h4>';
  bkHtml += '<ul style="font-size:.78rem;color:var(--muted);list-style:none;line-height:1.8">';
  bkHtml += '<li>1. No final de cada mes, os dados atuais sao salvos como snapshot</li>';
  bkHtml += '<li>2. O link da planilha de backup e registrado automaticamente</li>';
  bkHtml += '<li>3. Os clientes permanecem na carteira e continuam sendo alimentados diariamente</li>';
  bkHtml += '<li>4. Use a aba "Pipeline Diario" para atualizacoes diarias dos clientes</li>';
  bkHtml += '</ul></div>';
  backups.innerHTML = bkHtml;

})();
</script>
</body>
</html>
