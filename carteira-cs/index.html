<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carteira CS — Dashboard Maio 2025</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card-hover: #222531;
      --border: #2a2d3a;
      --text: #e4e6eb;
      --text-muted: #8b8fa3;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --green: #00b894;
      --green-bg: rgba(0,184,148,0.12);
      --yellow: #fdcb6e;
      --yellow-bg: rgba(253,203,110,0.12);
      --red: #e17055;
      --red-bg: rgba(225,112,85,0.12);
      --blue: #74b9ff;
      --blue-bg: rgba(116,185,255,0.12);
      --orange: #f39c12;
      --pink: #fd79a8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .header {
      background: linear-gradient(135deg, #1a1d27 0%, #22253a 100%);
      border-bottom: 1px solid var(--border);
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-light), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .period {
      font-size: 0.875rem;
      color: var(--text-muted);
      background: var(--card);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .section-title:first-child { margin-top: 0; }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 8px;
    }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .kpi-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .kpi-value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }
    .kpi-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .kpi-value.green { color: var(--green); }
    .kpi-value.red { color: var(--red); }
    .kpi-value.yellow { color: var(--yellow); }
    .kpi-value.blue { color: var(--blue); }
    .kpi-value.accent { color: var(--accent-light); }
    .kpi-value.orange { color: var(--orange); }

    /* Progress bar */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 1s ease;
    }

    /* Charts grid */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 8px;
    }
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .chart-card h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text);
    }
    .chart-wrapper {
      position: relative;
      width: 100%;
    }

    /* Specialist cards */
    .specialist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 8px;
    }
    .specialist-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .specialist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .specialist-name {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .specialist-badge {
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-onboarding { background: var(--blue-bg); color: var(--blue); }
    .badge-ongoing { background: var(--green-bg); color: var(--green); }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--text-muted); }
    .stat-value { font-weight: 600; }
    .score-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .score-green { background: var(--green-bg); color: var(--green); }
    .score-yellow { background: var(--yellow-bg); color: var(--yellow); }
    .score-red { background: var(--red-bg); color: var(--red); }

    /* Tables */
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
      margin-bottom: 8px;
    }
    .table-card h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th {
      text-align: left;
      padding: 10px 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border-bottom: 2px solid var(--border);
      font-size: 0.7rem;
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:hover td { background: rgba(108,92,231,0.05); }
    .status-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .pill-green { background: var(--green-bg); color: var(--green); }
    .pill-yellow { background: var(--yellow-bg); color: var(--yellow); }
    .pill-red { background: var(--red-bg); color: var(--red); }
    .pill-blue { background: var(--blue-bg); color: var(--blue); }
    .pill-lost { background: rgba(253,121,168,0.12); color: var(--pink); }

    /* Filter controls */
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .filter-btn .count {
      background: rgba(255,255,255,0.15);
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 4px;
      font-size: 0.7rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 12px; }
      .header { padding: 16px; }
      .header h1 { font-size: 1.2rem; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
      .specialist-grid { grid-template-columns: 1fr; }
      .kpi-value { font-size: 1.5rem; }
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60vh;
      font-size: 1.1rem;
      color: var(--text-muted);
    }
    .loading::after {
      content: '';
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin-left: 12px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Fade in animation */
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .charts-grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 8px;
    }

    .footer {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">Carteira CS — Dashboard</h1>
    <span class="period" id="period">Carregando...</span>
  </div>

  <div class="container" id="app">
    <div class="loading" id="loading">Carregando dados</div>
  </div>

  <script>
  (async function() {
    const resp = await fetch('data.json');
    const D = await resp.json();

    document.getElementById('title').textContent = D.titulo + ' — Dashboard';
    document.getElementById('period').textContent = D.periodo;
    document.getElementById('loading').remove();

    const app = document.getElementById('app');

    // ─── Helper ───
    function el(tag, cls, html) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html) e.innerHTML = html;
      return e;
    }

    function pct(val, max) {
      return max ? Math.min(Math.round((val / max) * 100), 100) : 0;
    }

    function statusPill(status) {
      if (!status) return '<span class="status-pill pill-blue">—</span>';
      if (status.includes('últimos 30')) return `<span class="status-pill pill-green">${status}</span>`;
      if (status.includes('31 e 50')) return `<span class="status-pill pill-yellow">${status}</span>`;
      if (status.includes('50 dias ou mais')) return `<span class="status-pill pill-red">${status}</span>`;
      return `<span class="status-pill pill-blue">${status}</span>`;
    }

    function carteiraPill(c) {
      if (!c) return '';
      if (c === 'Lost') return `<span class="status-pill pill-lost">${c}</span>`;
      if (c === 'Camila') return `<span class="status-pill pill-blue">${c}</span>`;
      if (c === 'Andressa') return `<span class="status-pill pill-green">${c}</span>`;
      if (c === 'Emanuella') return `<span class="status-pill pill-yellow">${c}</span>`;
      return `<span class="status-pill pill-blue">${c}</span>`;
    }

    function scoreBadge(pct) {
      if (pct >= 80) return `<span class="score-badge score-green">${pct}%</span>`;
      if (pct >= 50) return `<span class="score-badge score-yellow">${pct}%</span>`;
      return `<span class="score-badge score-red">${pct}%</span>`;
    }

    // chart defaults
    Chart.defaults.color = '#8b8fa3';
    Chart.defaults.borderColor = '#2a2d3a';
    Chart.defaults.font.family = "'Inter', sans-serif";

    // ═══════════════════════════════════════════
    // SECTION: KPIs
    // ═══════════════════════════════════════════
    const mg = D.meta_geral;
    const vg = D.visao_geral;

    const kpiSection = el('div', 'fade-in');
    kpiSection.appendChild(el('div', 'section-title', 'Visao Geral'));

    const kpiGrid = el('div', 'kpi-grid');
    const kpis = [
      {label: 'Clientes na Carteira', value: vg.total_clientes, color: 'accent', sub: `Média ${vg.media_contratos} contratos/cliente`},
      {label: 'Meta de Contratos', value: `${mg.contratos.realizado}/${mg.contratos.meta}`, color: mg.contratos.percentual >= 70 ? 'green' : 'yellow',
       sub: `${mg.contratos.percentual}% atingido`, progress: mg.contratos.percentual, progressColor: mg.contratos.percentual >= 70 ? 'var(--green)' : 'var(--yellow)'},
      {label: 'Contratos Ativos (Maio)', value: vg.contratos_ativos_maio, color: 'blue', sub: `${vg.contratos_emitidos_ate_abril} emitidos até Abril`},
      {label: 'Retenção', value: `${mg.retencao.percentual_retencao}%`, color: mg.retencao.percentual_retencao >= 60 ? 'green' : 'red',
       sub: `${mg.retencao.clientes_totais} clientes | ${mg.retencao.clientes_para_reverter} p/ reverter`, progress: mg.retencao.percentual_retencao, progressColor: mg.retencao.percentual_retencao >= 60 ? 'var(--green)' : 'var(--red)'},
      {label: 'Onboarding', value: `${mg.onboarding.realizado}/${mg.onboarding.meta}`, color: mg.onboarding.percentual >= 100 ? 'green' : 'yellow',
       sub: `${mg.onboarding.percentual}% | ${mg.onboarding.clientes_revertidos} revertidos`, progress: Math.min(mg.onboarding.percentual, 100), progressColor: mg.onboarding.percentual >= 100 ? 'var(--green)' : 'var(--yellow)'},
      {label: 'Ongoing', value: `${mg.ongoing.realizado}/${mg.ongoing.meta}`, color: mg.ongoing.percentual >= 70 ? 'green' : 'red',
       sub: `${mg.ongoing.percentual}% atingido`, progress: mg.ongoing.percentual, progressColor: mg.ongoing.percentual >= 70 ? 'var(--green)' : 'var(--red)'},
      {label: 'Clientes em Lost', value: D.clientes_lost.total, color: 'red', sub: 'Sem contrato há 200+ dias'},
      {label: 'Clientes Novos', value: vg.lost_distribution['NOVO'] || 0, color: 'green', sub: 'Entraram este mês'},
    ];
    kpis.forEach(k => {
      const card = el('div', 'kpi-card');
      card.innerHTML = `
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value ${k.color}">${k.value}</div>
        <div class="kpi-sub">${k.sub}</div>
        ${k.progress !== undefined ? `<div class="progress-bar"><div class="progress-fill" style="width:${k.progress}%;background:${k.progressColor}"></div></div>` : ''}
      `;
      kpiGrid.appendChild(card);
    });
    kpiSection.appendChild(kpiGrid);
    app.appendChild(kpiSection);

    // ═══════════════════════════════════════════
    // SECTION: Charts Row 1
    // ═══════════════════════════════════════════
    const chartsSection = el('div', 'fade-in');
    chartsSection.appendChild(el('div', 'section-title', 'Distribuicao'));
    const chartsGrid = el('div', 'charts-grid');

    // Status Distribution (Doughnut)
    const statusCard = el('div', 'chart-card');
    statusCard.innerHTML = '<h3>Status dos Clientes</h3><div class="chart-wrapper"><canvas id="statusChart"></canvas></div>';
    chartsGrid.appendChild(statusCard);

    // Carteira Distribution (Bar)
    const carteiraCard = el('div', 'chart-card');
    carteiraCard.innerHTML = '<h3>Clientes por Especialista</h3><div class="chart-wrapper"><canvas id="carteiraChart"></canvas></div>';
    chartsGrid.appendChild(carteiraCard);

    chartsSection.appendChild(chartsGrid);
    app.appendChild(chartsSection);

    // Status Chart
    const statusLabels = Object.keys(vg.status_distribution).map(s => {
      if (s.includes('últimos 30')) return 'Últimos 30 dias';
      if (s.includes('31 e 50')) return 'Entre 31-50 dias';
      if (s.includes('50 dias ou mais')) return 'Mais de 50 dias';
      return s;
    });
    new Chart(document.getElementById('statusChart'), {
      type: 'doughnut',
      data: {
        labels: statusLabels,
        datasets: [{
          data: Object.values(vg.status_distribution),
          backgroundColor: ['#00b894', '#fdcb6e', '#e17055', '#74b9ff'],
          borderWidth: 0,
          hoverOffset: 8,
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, font: { size: 11 } } },
        },
        cutout: '65%',
      }
    });

    // Carteira Chart
    const carteiraLabels = Object.keys(vg.carteira_distribution);
    const carteiraColors = carteiraLabels.map(l => {
      if (l === 'Camila') return '#74b9ff';
      if (l === 'Andressa') return '#00b894';
      if (l === 'Emanuella') return '#fdcb6e';
      if (l === 'Lost') return '#fd79a8';
      return '#a29bfe';
    });
    new Chart(document.getElementById('carteiraChart'), {
      type: 'bar',
      data: {
        labels: carteiraLabels,
        datasets: [{
          data: Object.values(vg.carteira_distribution),
          backgroundColor: carteiraColors,
          borderRadius: 6,
          barPercentage: 0.6,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { color: '#2a2d3a' }, ticks: { font: { size: 11 } } },
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        }
      }
    });

    // ═══════════════════════════════════════════
    // SECTION: Churn + Contratos Status
    // ═══════════════════════════════════════════
    const churnSection = el('div', 'fade-in');
    churnSection.appendChild(el('div', 'section-title', 'Analise de Churn & Contratos'));
    const churnGrid = el('div', 'charts-grid');

    // Churn Chart
    const churnCard = el('div', 'chart-card');
    churnCard.innerHTML = '<h3>Dias sem Contrato (Distribuicao)</h3><div class="chart-wrapper"><canvas id="churnChart"></canvas></div>';
    churnGrid.appendChild(churnCard);

    // Contratos Status
    const contCard = el('div', 'chart-card');
    contCard.innerHTML = '<h3>Contratos Vencidos e a Pagar</h3><div class="chart-wrapper"><canvas id="contratosChart"></canvas></div>';
    churnGrid.appendChild(contCard);

    churnSection.appendChild(churnGrid);
    app.appendChild(churnSection);

    // Churn Chart
    const churnLabels = D.churn.map(c => c.range);
    const churnData = D.churn.map(c => c.count);
    const churnColors = churnData.map((v, i) => {
      if (i <= 1) return '#00b894';
      if (i <= 3) return '#fdcb6e';
      return '#e17055';
    });
    new Chart(document.getElementById('churnChart'), {
      type: 'bar',
      data: {
        labels: churnLabels,
        datasets: [{
          label: 'Corretores',
          data: churnData,
          backgroundColor: churnColors,
          borderRadius: 4,
          barPercentage: 0.7,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { color: '#2a2d3a' }, title: { display: true, text: 'Corretores', color: '#8b8fa3' } },
          x: { grid: { display: false }, title: { display: true, text: 'Dias sem contrato', color: '#8b8fa3' }, ticks: { font: { size: 10 } } },
        }
      }
    });

    // Contratos Chart (horizontal bar)
    const contLabels = Object.keys(D.contratos_vencidos.status_counts);
    const contData = Object.values(D.contratos_vencidos.status_counts);
    const contColors = contLabels.map(l => {
      if (l.includes('Finalizado')) return '#e17055';
      if (l.includes('Maio')) return '#fdcb6e';
      if (l.includes('Junho')) return '#74b9ff';
      return '#a29bfe';
    });
    new Chart(document.getElementById('contratosChart'), {
      type: 'bar',
      data: {
        labels: contLabels.map(l => l.length > 30 ? l.slice(0, 28) + '...' : l),
        datasets: [{
          data: contData,
          backgroundColor: contColors,
          borderRadius: 4,
          barPercentage: 0.6,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero: true, grid: { color: '#2a2d3a' } },
          y: { grid: { display: false }, ticks: { font: { size: 10 } } },
        }
      }
    });

    // ═══════════════════════════════════════════
    // SECTION: Specialist Performance
    // ═══════════════════════════════════════════
    const specSection = el('div', 'fade-in');
    specSection.appendChild(el('div', 'section-title', 'Desempenho Individual'));
    const specGrid = el('div', 'specialist-grid');

    D.meta_individual.forEach(s => {
      const card = el('div', 'specialist-card');
      const badgeClass = s.tipo === 'Onboarding' ? 'badge-onboarding' : 'badge-ongoing';
      let rows = `
        <div class="stat-row"><span class="stat-label">Clientes na carteira</span><span class="stat-value">${s.clientes}</span></div>
        <div class="stat-row"><span class="stat-label">Meta de contratos</span><span class="stat-value">${s.meta_contratos}</span></div>
        <div class="stat-row"><span class="stat-label">Contratos ativos</span><span class="stat-value">${s.contratos_ativos}</span></div>
        <div class="stat-row"><span class="stat-label">% Contratos</span><span class="stat-value">${scoreBadge(s.percentual_contratos)}</span></div>
      `;
      if (s.clientes_risco !== undefined) {
        rows += `<div class="stat-row"><span class="stat-label">Clientes em risco</span><span class="stat-value">${s.clientes_risco}</span></div>`;
        rows += `<div class="stat-row"><span class="stat-label">Clientes revertidos</span><span class="stat-value">${s.clientes_revertidos}</span></div>`;
      }
      if (s.segundo_contrato !== undefined) {
        rows += `<div class="stat-row"><span class="stat-label">2o contrato emitido</span><span class="stat-value">${s.segundo_contrato}</span></div>`;
      }
      rows += `<div class="stat-row"><span class="stat-label">Resultado Final</span><span class="stat-value">${scoreBadge(s.resultado_final)}</span></div>`;

      card.innerHTML = `
        <div class="specialist-header">
          <span class="specialist-name">${s.nome}</span>
          <span class="specialist-badge ${badgeClass}">${s.tipo}</span>
        </div>
        ${rows}
      `;
      specGrid.appendChild(card);
    });
    specSection.appendChild(specGrid);
    app.appendChild(specSection);

    // ═══════════════════════════════════════════
    // SECTION: Lost Clients
    // ═══════════════════════════════════════════
    const lostSection = el('div', 'fade-in');
    lostSection.appendChild(el('div', 'section-title', `Clientes em Lost (${D.clientes_lost.total})`));

    // Motivo chart + table
    const lostGrid = el('div', 'charts-grid');

    // Motivo chart
    const motivoCard = el('div', 'chart-card');
    motivoCard.innerHTML = '<h3>Motivos de Lost</h3><div class="chart-wrapper"><canvas id="motivoChart"></canvas></div>';
    lostGrid.appendChild(motivoCard);

    // Lost table
    const lostTableCard = el('div', 'table-card');
    let lostRows = D.clientes_lost.items.map(c => `
      <tr>
        <td>${c.corretor || '—'}</td>
        <td>${c.dias_sem_contrato != null ? c.dias_sem_contrato + ' dias' : '—'}</td>
        <td>${c.contratos_anteriores}</td>
        <td>${c.motivo || 'Nenhum'}</td>
      </tr>
    `).join('');
    lostTableCard.innerHTML = `
      <h3>Detalhes dos Clientes Lost</h3>
      <table>
        <thead><tr><th>Corretor</th><th>Dias sem contrato</th><th>Contratos anteriores</th><th>Motivo</th></tr></thead>
        <tbody>${lostRows}</tbody>
      </table>
    `;
    lostGrid.appendChild(lostTableCard);
    lostSection.appendChild(lostGrid);
    app.appendChild(lostSection);

    // Motivo Chart
    const motivoLabels = Object.keys(D.clientes_lost.motivo_counts);
    new Chart(document.getElementById('motivoChart'), {
      type: 'doughnut',
      data: {
        labels: motivoLabels,
        datasets: [{
          data: Object.values(D.clientes_lost.motivo_counts),
          backgroundColor: ['#e17055', '#fdcb6e', '#74b9ff', '#a29bfe', '#00b894', '#fd79a8', '#f39c12', '#636e72'],
          borderWidth: 0,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true, font: { size: 10 } } } },
        cutout: '60%',
      }
    });

    // ═══════════════════════════════════════════
    // SECTION: Full Client Table
    // ═══════════════════════════════════════════
    const tableSection = el('div', 'fade-in');
    tableSection.appendChild(el('div', 'section-title', 'Todos os Clientes'));

    // Filter bar
    const filterBar = el('div', 'filter-bar');
    const allCarteiras = ['Todos', ...Object.keys(vg.carteira_distribution)];
    allCarteiras.forEach(c => {
      const btn = el('button', 'filter-btn' + (c === 'Todos' ? ' active' : ''));
      const count = c === 'Todos' ? vg.total_clientes : vg.carteira_distribution[c];
      btn.innerHTML = `${c} <span class="count">${count}</span>`;
      btn.dataset.filter = c;
      btn.addEventListener('click', () => filterClients(c));
      filterBar.appendChild(btn);
    });
    tableSection.appendChild(filterBar);

    const clientTableCard = el('div', 'table-card');
    clientTableCard.id = 'clientTable';
    tableSection.appendChild(clientTableCard);
    app.appendChild(tableSection);

    function filterClients(filter) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.filter-btn[data-filter="${filter}"]`).classList.add('active');

      const filtered = filter === 'Todos' ? vg.clients : vg.clients.filter(c => c.carteira === filter);
      const rows = filtered.map(c => `
        <tr>
          <td style="font-weight:500">${c.corretor}</td>
          <td>${c.dias_sem_contrato != null ? c.dias_sem_contrato : '—'}</td>
          <td>${statusPill(c.status)}</td>
          <td>${carteiraPill(c.carteira)}</td>
          <td>${c.contratos_ate_30_04}</td>
          <td>${c.contrato_ativo_maio}</td>
          <td>${c.lost === 'SIM' ? '<span class="status-pill pill-red">SIM</span>' : c.lost === 'NOVO' ? '<span class="status-pill pill-green">NOVO</span>' : c.lost || '—'}</td>
        </tr>
      `).join('');

      clientTableCard.innerHTML = `
        <table>
          <thead><tr>
            <th>Corretor</th>
            <th>Dias s/ contrato</th>
            <th>Status</th>
            <th>Carteira</th>
            <th>Contratos (ate Abr)</th>
            <th>Contratos (Mai)</th>
            <th>Lost?</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }
    filterClients('Todos');

    // Footer
    const footer = el('div', 'footer');
    footer.textContent = `Dashboard gerado automaticamente a partir da planilha "[Maio] Carteira CS" — ${new Date().toLocaleDateString('pt-BR')}`;
    app.appendChild(footer);

  })();
  </script>
</body>
</html>
